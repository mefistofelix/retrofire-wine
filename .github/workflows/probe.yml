name: Probe bundle

# Builds Box86 (ARMv8 AArch32, dynarec) and packs it with a minimal Debian armhf root file
# system, Wine x86 and Termux's proot into one archive, published as the release "probe".

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  BOX86_REF: v0.3.8
  WINE_VERSION: "9.0"
  DEBIAN_SUITE: trixie   # glibc at least as new as the cross compiler's (Ubuntu 24.04: 2.39)

jobs:
  core:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the libretro core (Android armeabi-v7a)
        run: |
          mkdir out
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"             -shared -fPIC -O2 -Wall -Icore -o out/retrofire_wine_libretro_android.so core/libretro.c
          cp core/retrofire_wine_libretro.info out/
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view core >/dev/null 2>&1 || gh release create core --prerelease --target "$GITHUB_SHA"             --title "libretro core" --notes "RetroFire Wine libretro core for Android armeabi-v7a."
          gh release upload core out/* --clobber

  bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap arch-test debian-archive-keyring qemu-user-static binfmt-support \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross gcc-mingw-w64-i686 cmake make python3 xz-utils

      # Ubuntu's ARM compiler makes time_t 64 bits wide by default. Box86 hands the x86
      # program's own structures (32-bit times) to the C library, so it must be built with the
      # old 32-bit time_t: with the 64-bit one every clock lost its nanoseconds (Windows time
      # moved in steps of one second) and the sleeps were wrong.
      - name: Build Box86
        run: |
          OLD_TIME="-U_TIME_BITS -U_FILE_OFFSET_BITS"
          echo "compiler defaults:"; arm-linux-gnueabihf-gcc -dM -E - < /dev/null | grep -E "_TIME_BITS|_FILE_OFFSET_BITS" || true
          arm-linux-gnueabihf-gcc $OLD_TIME -fsyntax-only probe/time32.c
          git clone --depth 1 --branch "$BOX86_REF" https://github.com/ptitSeb/box86.git
          cmake -S box86 -B box86/build -DRPI4=1 -DARM_DYNAREC=ON -DNOGIT=1 -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="$OLD_TIME" -DCMAKE_ASM_FLAGS="$OLD_TIME"
          make -C box86/build -j"$(nproc)"
          file box86/build/box86

      - name: Root file system (Debian armhf, minimal)
        run: |
          sudo mmdebstrap --arch=armhf --variant=minbase \
            --include=xvfb,xdotool,libx11-dev,libxtst-dev,libc6-dev,libstdc++6,libfreetype6,libfontconfig1,libx11-6,libxext6,libxrender1,libxrandr2,libxcursor1,libxi6,libxfixes3,libxinerama1,libxcomposite1,libasound2t64,libgnutls30t64,ca-certificates \
            "$DEBIAN_SUITE" rootfs http://deb.debian.org/debian
          sudo rm -rf rootfs/var/cache/apt/* rootfs/var/lib/apt/lists/* rootfs/usr/share/doc/* \
            rootfs/usr/share/man/* rootfs/usr/share/locale/* rootfs/dev/*
          sudo du -sh rootfs

      # proot runs outside the root file system, so it is Termux's Android build (bionic).
      # Debian's keeps its files in /tmp, which Android lacks, and inside an app Android's
      # system call filter kills the glibc programs unless proot answers "not implemented"
      # for the calls the filter does not know, which Termux's does.
      - name: Host tools (Termux proot)
        run: |
          base=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$base/dists/stable/main/binary-arm/Packages" -o Packages
          mkdir -p host tdeb
          for p in proot libtalloc libandroid-shmem; do
            f="$(awk -v p="$p" '$1 == "Package:" { ok = ($2 == p) } ok && $1 == "Filename:" { print $2; exit }' Packages)"
            echo "$p: $f"
            curl -fsSL "$base/$f" -o "tdeb/$p.deb"
            dpkg-deb -x "tdeb/$p.deb" "tdeb/$p"
          done
          U=data/data/com.termux/files/usr
          cp -L "tdeb/proot/$U/bin/proot" host/proot
          cp -L "tdeb/proot/$U/libexec/proot/loader" host/loader
          cp -L "tdeb/libtalloc/$U/lib/libtalloc.so.2" host/libtalloc.so.2
          cp -L "tdeb/libandroid-shmem/$U/lib/libandroid-shmem.so" host/libandroid-shmem.so
          chmod 755 host/*
          file host/*

      - name: Add Box86 and Wine
        run: |
          sudo install -m 755 box86/build/box86 rootfs/usr/local/bin/box86
          sudo mkdir -p rootfs/usr/lib/i386-linux-gnu rootfs/etc/binfmt.d
          sudo cp box86/x86lib/* rootfs/usr/lib/i386-linux-gnu/
          curl -fsSL -o wine.tar.xz "https://github.com/Kron4ek/Wine-Builds/releases/download/${WINE_VERSION}/wine-${WINE_VERSION}-x86.tar.xz"
          sudo mkdir -p rootfs/opt/wine
          sudo tar -xJf wine.tar.xz -C rootfs/opt/wine --strip-components=1
          sudo du -sh rootfs/opt/wine rootfs
          # The ARM kernel cannot start Wine's x86 programs when Wine launches them itself
          # (its server, a child process): each becomes a script that calls Box86.
          for f in wine wineserver; do
            sudo mv rootfs/opt/wine/bin/$f rootfs/opt/wine/bin/$f.x86
            sudo install -m 755 probe/x86wrap.sh rootfs/opt/wine/bin/$f
          done
          sudo mv rootfs/opt/wine/bin/wine-preloader rootfs/opt/wine/bin/wine-preloader.off

      - name: Session scripts and input helper
        run: |
          arm-linux-gnueabihf-gcc --sysroot=$PWD/rootfs -O2 -o rf-input session/rf-input.c -lXtst -lX11
          sudo install -m 755 rf-input session/rf-session rootfs/usr/local/bin/

      - name: Benchmark program (Win32 x86)
        run: |
          i686-w64-mingw32-gcc -O2 -static -o bench.exe probe/bench.c
          i686-w64-mingw32-objdump -d bench.exe --no-show-raw-insn | awk '/<_lcg>:/,/ret/' | head -40
          sudo install -m 644 bench.exe rootfs/root/bench.exe

      - name: Pack
        run: |
          mkdir out
          cp probe/run.sh run.sh
          cp session/host.sh host.sh
          sudo tar --numeric-owner -czf out/retrofire-wine-probe.tar.gz run.sh host.sh host rootfs
          cp box86/build/box86 out/box86
          cp bench.exe out/bench.exe
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # keep the release and its tag, replace the files (deleting and recreating the tag in
          # one go left no release at all once)
          gh release view probe >/dev/null 2>&1 || gh release create probe --prerelease --target "$GITHUB_SHA"             --title "Probe bundle" --notes "Box86 ${BOX86_REF}, Wine ${WINE_VERSION} x86 (Kron4ek), Debian ${DEBIAN_SUITE} armhf."
          gh release upload probe out/*.tar.gz out/bench.exe out/box86 --clobber
